name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch makes an in-flight run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # `engines.node` is >=22; pin the major so a runner image update cannot
  # silently move the toolchain under the project.
  NODE_VERSION: '22'

jobs:
  # Everything that needs no database. Runs in parallel with `test`, so a type
  # error surfaces without waiting for Postgres to come up and 222 tests to run.
  check:
    name: Typecheck, build, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # `ci` rather than `install`: it installs exactly the lockfile and fails
      # if package.json and the lockfile disagree, which is the check we want.
      - name: Install
        run: npm ci

      # `@finance/schemas` is consumed as compiled output — both workspaces read
      # its `.d.ts` — so it must exist before anything typechecks or builds.
      # `npm ci` already builds it through the package's own `prepare` script,
      # and the root scripts below build it again; this step costs a second and
      # makes the ordering visible rather than implied.
      - name: Build shared schemas
        run: npm run build:schemas

      # A dependency is only as current as the last time somebody looked. This
      # gate is deliberately narrower than a bare `npm audit`: it fails on a
      # high or critical advisory in a *runtime* dependency — the code that
      # actually ships in the image — and reports everything else without
      # failing. A build tool's dev-server advisory is worth knowing about and
      # is not a reason to block an unrelated pull request, which is exactly how
      # a noisy gate ends up being ignored or deleted.
      - name: Production dependencies carry no high or critical advisory
        run: npm audit --omit=dev --audit-level=high

      - name: Full advisory report (informational)
        if: always()
        run: npm audit || true

      - name: Typecheck (schemas, api and web)
        run: npm run typecheck

      - name: Build api
        run: npm run build --workspace=@finance/api

      - name: Build web
        run: npm run build --workspace=@finance/web

      # Two generated files, one chain: the API writes `docs/openapi.json` from
      # the router it actually boots, and the client writes `src/api/schema.d.ts`
      # from that. Both go stale the moment a route or a response schema changes
      # and nobody regenerates them, so both are regenerated here and any
      # difference fails the build — the only thing that keeps either honest.
      # Neither step opens a database, which is why they belong in this job.
      - name: OpenAPI document and client types are up to date
        run: npm run check:openapi

      # Two ways a translated string goes wrong, neither of which typechecks or
      # fails a build: a key missing from one catalogue falls back to English
      # silently, and a key missing from *all* of them renders as itself — a
      # button reading `common.apply`. Parity cannot see the second, so the
      # script checks that every literal `t()` key resolves as well.
      - name: Translations are complete and every key resolves
        run: npm run check:i18n

      # No Postgres, no Redis: money, dates, recurrence, anomaly detectors, CSV
      # parsing and import mapping are all pure. Seconds, not minutes.
      - name: Unit tests
        run: npm run test:unit

      # The Dockerfile rotted unnoticed for several sessions: it was written
      # before `packages/schemas` existed and could neither install nor compile.
      # Nothing catches that except building it, so CI does.
      - name: Build the production image
        run: docker build -f apps/api/Dockerfile -t finance-api:ci .

      # The client's image, for the same reason: nothing else builds it, and it
      # is the only thing that serves the HTML — so it is the only place a
      # Content-Security-Policy, `frame-ancestors` or HSTS can be set. A broken
      # nginx.conf would otherwise be discovered at deploy time.
      - name: Build the web image
        run: docker build -f apps/web/Dockerfile -t finance-web:ci .

      # `nginx -t` parses the config the way the real server will. Cheap, and it
      # catches the class of mistake that makes a container restart-loop.
      - name: The web image's nginx config parses
        run: docker run --rm finance-web:ci nginx -t

      # Building proves it compiles; this proves it can *run*. Importing the
      # express app factory pulls in every route, service and library the server
      # touches, without opening a socket to anything — which is precisely the
      # check that a file-existence pass fails: an image that built cleanly still
      # died on boot with `ERR_MODULE_NOT_FOUND: i18next`, because npm had nested
      # that package under `apps/api/node_modules` and only the root tree had
      # been copied.
      #
      # The environment is everything `config/production-policy.ts` demands of a
      # production boot, which the image is — and it has to be *all* of it, or
      # this step fails for a reason that has nothing to do with the module
      # graph it exists to check. That is not hypothetical: adding the
      # same-origin rule broke this step, because the two base URLs fall back to
      # the development defaults (`:4000` and `:5173`), which are different
      # origins. **A new refusal in `production-policy.ts` owes this step a
      # matching variable.**
      #
      # Secrets are generated per run rather than reused from the `test` job,
      # since those throwaways are published and are exactly what is refused.
      # Nothing here signs, sends or resolves anything.
      - name: The image can load the whole app graph
        run: |
          docker run --rm \
            -e DATABASE_URL=postgres://finance:finance@127.0.0.1:5432/finance \
            -e JWT_ACCESS_SECRET="$(openssl rand -hex 32)" \
            -e JWT_REFRESH_SECRET="$(openssl rand -hex 32)" \
            -e EMAIL_TOKEN_SECRET="$(openssl rand -hex 32)" \
            -e SMTP_HOST=smtp.invalid \
            -e API_BASE_URL=https://finance.invalid \
            -e WEB_BASE_URL=https://finance.invalid \
            -e LOG_LEVEL=silent \
            finance-api:ci \
            node --input-type=module -e "await import('/app/apps/api/dist/app.js'); console.log('app graph loaded')"

      # The other half of that gate: the same image, the same production mode,
      # and a configuration this repository publishes. Each must *fail*, and the
      # failure is the check — C-1 and C-2 in AUDIT_REPORT.md are both paths
      # where a development configuration reached a production container and
      # nothing objected.
      - name: The image refuses a published secret and a development mail sink
        run: |
          refuses() {
            local label="$1"; shift
            if docker run --rm \
              -e DATABASE_URL=postgres://finance:finance@127.0.0.1:5432/finance \
              -e LOG_LEVEL=silent \
              "$@" \
              finance-api:ci \
              node --input-type=module -e "await import('/app/apps/api/dist/app.js')"; then
              echo "::error::the production image booted with $label"
              exit 1
            fi
            echo "refused: $label"
          }

          # Each of these must fail for *its own* reason, so every case supplies
          # a valid value for every rule it is not testing.
          refuses "a published JWT secret" \
            -e JWT_ACCESS_SECRET=dev-only-insecure-access-secret-change-me \
            -e JWT_REFRESH_SECRET=dev-only-insecure-refresh-secret-change-me \
            -e EMAIL_TOKEN_SECRET="$(openssl rand -hex 32)" \
            -e SMTP_HOST=smtp.invalid \
            -e API_BASE_URL=https://finance.invalid \
            -e WEB_BASE_URL=https://finance.invalid

          # A new refusal in production-policy.ts owes this step a matching case:
          # EMAIL_TOKEN_SECRET is held to the same bar as the two JWT secrets, so
          # a published or placeholder-shaped value here must fail on its own,
          # with valid JWT secrets supplied so the failure is attributable.
          refuses "a published email-token secret" \
            -e JWT_ACCESS_SECRET="$(openssl rand -hex 32)" \
            -e JWT_REFRESH_SECRET="$(openssl rand -hex 32)" \
            -e EMAIL_TOKEN_SECRET=dev-only-insecure-email-token-secret-change-me \
            -e SMTP_HOST=smtp.invalid \
            -e API_BASE_URL=https://finance.invalid \
            -e WEB_BASE_URL=https://finance.invalid

          refuses "a development mail sink" \
            -e JWT_ACCESS_SECRET="$(openssl rand -hex 32)" \
            -e JWT_REFRESH_SECRET="$(openssl rand -hex 32)" \
            -e EMAIL_TOKEN_SECRET="$(openssl rand -hex 32)" \
            -e SMTP_HOST=mailhog \
            -e API_BASE_URL=https://finance.invalid \
            -e WEB_BASE_URL=https://finance.invalid

          # A split origin does not degrade the session, it ends it: the refresh
          # cookie is SameSite=Lax and would never be sent, so every user is
          # signed out fifteen minutes in with nothing but a 401 to show for it.
          refuses "the API and client on different origins" \
            -e JWT_ACCESS_SECRET="$(openssl rand -hex 32)" \
            -e JWT_REFRESH_SECRET="$(openssl rand -hex 32)" \
            -e EMAIL_TOKEN_SECRET="$(openssl rand -hex 32)" \
            -e SMTP_HOST=smtp.invalid \
            -e API_BASE_URL=https://api.example.com \
            -e WEB_BASE_URL=https://app.example.com

      # The deployment composition is not exercised by anything else here, and a
      # broken anchor or a mistyped `${VAR:?}` only shows up at deploy time.
      # Both directions matter: it renders when the credentials are supplied, and
      # it refuses to render when they are not — the latter is the whole point of
      # a file that defaults no credential.
      - name: The deployment composition is valid, and requires its credentials
        run: |
          docker compose -f docker-compose.yml config --quiet
          if docker compose -f docker-compose.deploy.yml --env-file /dev/null config --quiet 2>/dev/null; then
            echo "::error::docker-compose.deploy.yml rendered with no credentials supplied"
            exit 1
          fi
          JWT_ACCESS_SECRET=$(openssl rand -hex 32) \
          JWT_REFRESH_SECRET=$(openssl rand -hex 32) \
          EMAIL_TOKEN_SECRET=$(openssl rand -hex 32) \
          POSTGRES_PASSWORD=$(openssl rand -hex 16) \
          REDIS_PASSWORD=$(openssl rand -hex 16) \
          SMTP_HOST=smtp.invalid \
          PUBLIC_URL=https://finance.invalid \
            docker compose -f docker-compose.deploy.yml --env-file /dev/null config --quiet

      # Cheap and worth having: a syntax error here would otherwise only be
      # found the day someone actually needs a restore, which is the worst
      # possible day to find one. `bash -n` parses without running anything —
      # no Postgres needed for that half. The real end-to-end proof (a backup
      # taken, corrupted on purpose, and restored byte-for-byte) is manual and
      # documented in docs/decisions.md, since it means dropping a database.
      - name: The backup and restore scripts parse
        run: |
          bash -n scripts/backup.sh
          bash -n scripts/restore.sh
          echo "deployment composition ok"
          echo "refused, as it should"

  test:
    name: Full suite (real Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      # The suite runs against a real database rather than mocks — see
      # docs/decisions.md. It creates and migrates `finance_test` itself.
      #
      # Redis and MailHog are deliberately absent: under NODE_ENV=test the cache
      # helpers short-circuit, workspace invalidation is a no-op and the rate
      # limiter uses an in-memory store, so nothing in the suite reaches either.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: finance
          POSTGRES_PASSWORD: finance
          POSTGRES_DB: finance
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U finance -d finance"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgres://finance:finance@localhost:5432/finance
      TEST_DATABASE_URL: postgres://finance:finance@localhost:5432/finance_test
      # Throwaway values for a throwaway database. These are not secrets and
      # must not become them: nothing signed here outlives the job. The schema
      # requires at least 16 characters.
      JWT_ACCESS_SECRET: ci-access-secret-not-a-real-key-000000
      JWT_REFRESH_SECRET: ci-refresh-secret-not-a-real-key-00000
      EMAIL_TOKEN_SECRET: ci-email-token-secret-not-a-real-key-0
      LOG_LEVEL: warn

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install
        run: npm ci

      # The migration steps below run `tsx` straight against `apps/api/src`,
      # which imports `@finance/schemas` — so its compiled output has to be
      # there even though `npm test` would have built it for itself.
      - name: Build shared schemas
        run: npm run build:schemas

      # Applying every migration to an empty database is itself the first
      # assertion: the suite's global setup does this before any test runs.
      - name: Full suite
        run: npm test

      # Down-migrations are never exercised by the app and rot silently. Rolling
      # the newest one back and forward on the already-migrated test database
      # costs a second and catches a `down` that was never tried.
      - name: Migration rollback round-trip
        env:
          NODE_ENV: test
        run: |
          npm run migrate:down --workspace=@finance/api
          npm run migrate --workspace=@finance/api
          npm run migrate:status --workspace=@finance/api
