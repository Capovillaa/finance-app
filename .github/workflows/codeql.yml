name: CodeQL

# Finding L-6 in AUDIT_REPORT.md: `npm audit` (ci.yml) catches a known-vulnerable
# dependency; it has never looked at code this repository wrote itself. CodeQL is
# GitHub's own static analysis, free for a public repository and requiring no
# account or key beyond what `github-actions` already has — the same reason
# gitleaks.yml needed nothing new either.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Dependency-aware queries change under a codebase even when the code
    # itself does not, so this also runs on a schedule rather than only on a
    # diff — a Tuesday chosen for no reason other than not being at the same
    # instant every other scheduled job in a busy org tends to be.
    - cron: '17 3 * * 2'

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (javascript-typescript)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # JavaScript/TypeScript has no compiled build for CodeQL to run — its
      # extractor reads source directly, and `build-mode: manual` (which this
      # workflow tried first) fails outright with "does not support the manual
      # build mode." `@finance/schemas`'s compiled `dist/` is still built
      # first, though: apps/api and apps/web import it as compiled output (the
      # shared-package convention in CLAUDE.md), and having real type
      # declarations to resolve improves the analysis even though nothing here
      # is actually run.
      - name: Build shared schemas
        run: npm run build:schemas

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          build-mode: none

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: '/language:javascript-typescript'
