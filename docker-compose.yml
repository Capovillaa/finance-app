# Local development infrastructure, and nothing else.
#
#     npm run infra:up      # postgres + redis + mailhog
#
# The API, the worker and the migration runner used to live here too, behind a
# `profiles: ["app"]` key, and that was the shape of audit finding C-2: a
# service without a `profiles:` key is in the *default* profile and starts
# unconditionally, so `--profile app` never selected a deployed stack — it added
# three production containers to the development one, MailHog and default
# database credentials included. The deployed shape is now its own file,
# `docker-compose.deploy.yml`, which shares nothing with this one.
#
# Everything below is therefore free to be convenient: the passwords are
# well-known, the mail sink has no authentication, and that is fine for a
# database of demo data on a developer's machine. What it must not be is
# *reachable*, so every published port binds to the loopback interface
# explicitly rather than to all of them — Docker's default `"5432:5432"` means
# `0.0.0.0:5432`, which on a laptop joining an untrusted network is a Postgres
# with the password `finance` on the local WiFi.
#
# The project name is pinned to what compose derived from the directory before
# it was ever written down. It is what prefixes the volumes — changing it points
# this file at fresh, empty ones and abandons the local database.
name: finance_app

services:
  postgres:
    # Debian-based rather than -alpine: the musl build fails to exec its own
    # entrypoint under this host's Docker Desktop/WSL2 setup.
    image: postgres:16
    container_name: finance_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-finance}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-finance}
      POSTGRES_DB: ${POSTGRES_DB:-finance}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-finance} -d ${POSTGRES_DB:-finance}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: finance_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # A mail sink, not a mail server: it accepts everything, delivers nothing, and
  # shows it all at http://localhost:8025 with no authentication whatsoever.
  # That is the point in development and unacceptable anywhere else — every
  # workspace invitation link is a bearer token granting membership, and this UI
  # displays them. It has no counterpart in docker-compose.deploy.yml.
  mailhog:
    image: mailhog/mailhog:latest
    container_name: finance_mailhog
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MAILHOG_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${MAILHOG_UI_PORT:-8025}:8025"

volumes:
  postgres_data:
  redis_data:
