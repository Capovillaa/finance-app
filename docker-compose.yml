# The configuration the `app` profile runs with.
#
# It is spelled out here rather than inherited from `.env` with `env_file`,
# because `.env` is a development file: it is what `cp .env.example .env`
# produces, and the placeholder JWT secrets in it are published in a public
# repository. Loading it wholesale into containers that run as
# `NODE_ENV=production` is what made "the documented path from a fresh clone to a
# running production stack" carry public signing keys end to end.
#
# So the secrets are *required* here — `${VAR:?message}` stops compose before it
# starts anything — and everything else has a default matching
# `apps/api/src/config/env.ts`. Compose still interpolates from `.env` if one is
# present, which keeps local overrides working; what it can no longer do is pass
# a value nobody named. A placeholder that slips through anyway is refused a
# second time by the API itself, at boot, in `config/secret-policy.ts`.
x-app-environment: &app-environment
  # `.env` would otherwise put a production container into development mode,
  # which among other things asks pino for the `pino-pretty` transport a pruned
  # production image does not contain.
  NODE_ENV: production
  DATABASE_URL: postgres://${POSTGRES_USER:-finance}:${POSTGRES_PASSWORD:-finance}@postgres:5432/${POSTGRES_DB:-finance}
  REDIS_URL: redis://redis:6379
  JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?generate one - node -e "console.log(require('crypto').randomBytes(48).toString('base64url'))"}
  JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?generate a second, different one the same way}
  ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-15m}
  REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-30}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  API_BASE_URL: ${API_BASE_URL:-http://localhost:4000}
  WEB_BASE_URL: ${WEB_BASE_URL:-http://localhost:5173}
  CORS_ORIGINS: ${CORS_ORIGINS:-}
  TRUST_PROXY: ${TRUST_PROXY:-false}
  BASE_CURRENCY: ${BASE_CURRENCY:-BRL}
  EXCHANGE_RATE_PROVIDER: ${EXCHANGE_RATE_PROVIDER:-static}
  EXCHANGE_RATE_API_URL: ${EXCHANGE_RATE_API_URL:-}
  EXCHANGE_RATE_API_KEY: ${EXCHANGE_RATE_API_KEY:-}
  MAIL_FROM: ${MAIL_FROM:-Finance App <no-reply@finance.local>}

services:
  postgres:
    # Debian-based rather than -alpine: the musl build fails to exec its own
    # entrypoint under this host's Docker Desktop/WSL2 setup.
    image: postgres:16
    container_name: finance_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-finance}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-finance}
      POSTGRES_DB: ${POSTGRES_DB:-finance}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-finance} -d ${POSTGRES_DB:-finance}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: finance_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailhog:
    image: mailhog/mailhog:latest
    container_name: finance_mailhog
    restart: unless-stopped
    ports:
      - "${MAILHOG_SMTP_PORT:-1025}:1025"
      - "${MAILHOG_UI_PORT:-8025}:8025"

  # The `app` profile is the deployed shape of the system: one image, three
  # entrypoints. `docker compose --profile app up -d` brings it up in the right
  # order, because the schema has to be current before anything serves traffic.
  #
  #   migrate  runs to completion, then exits
  #   api      starts only once migrate succeeded
  #   worker   likewise
  #
  # A failed migration therefore stops the rollout instead of leaving a new
  # binary talking to an old schema.
  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: finance-api
    container_name: finance_migrate
    profiles: ["app"]
    # Not `unless-stopped`: this is a job, and a job that succeeded should stay
    # exited rather than being restarted forever.
    restart: "no"
    command: ["node", "apps/api/dist/db/migrate.js", "up"]
    environment: *app-environment
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: finance-api
    container_name: finance_api
    profiles: ["app"]
    restart: unless-stopped
    environment:
      <<: *app-environment
      # Development mail sink. C-2 in AUDIT_REPORT.md is the task that takes
      # MailHog out of the deployed composition entirely.
      SMTP_HOST: mailhog
      SMTP_PORT: "1025"
    ports:
      - "${PORT:-4000}:4000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: finance-api
    container_name: finance_worker
    profiles: ["app"]
    restart: unless-stopped
    command: ["node", "apps/api/dist/worker.js"]
    environment:
      <<: *app-environment
      SMTP_HOST: mailhog
      SMTP_PORT: "1025"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
