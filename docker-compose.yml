services:
  postgres:
    # Debian-based rather than -alpine: the musl build fails to exec its own
    # entrypoint under this host's Docker Desktop/WSL2 setup.
    image: postgres:16
    container_name: finance_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-finance}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-finance}
      POSTGRES_DB: ${POSTGRES_DB:-finance}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-finance} -d ${POSTGRES_DB:-finance}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: finance_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailhog:
    image: mailhog/mailhog:latest
    container_name: finance_mailhog
    restart: unless-stopped
    ports:
      - "${MAILHOG_SMTP_PORT:-1025}:1025"
      - "${MAILHOG_UI_PORT:-8025}:8025"

  # The `app` profile is the deployed shape of the system: one image, three
  # entrypoints. `docker compose --profile app up -d` brings it up in the right
  # order, because the schema has to be current before anything serves traffic.
  #
  #   migrate  runs to completion, then exits
  #   api      starts only once migrate succeeded
  #   worker   likewise
  #
  # A failed migration therefore stops the rollout instead of leaving a new
  # binary talking to an old schema.
  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: finance-api
    container_name: finance_migrate
    profiles: ["app"]
    # Not `unless-stopped`: this is a job, and a job that succeeded should stay
    # exited rather than being restarted forever.
    restart: "no"
    command: ["node", "apps/api/dist/db/migrate.js", "up"]
    env_file: .env
    environment:
      # See the note on the api service: `.env` is a development file and would
      # otherwise put a production container into development mode.
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-finance}:${POSTGRES_PASSWORD:-finance}@postgres:5432/${POSTGRES_DB:-finance}
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: finance-api
    container_name: finance_api
    profiles: ["app"]
    restart: unless-stopped
    env_file: .env
    environment:
      # `env_file` beats the image's own ENV, and `.env` is a development file —
      # without this the container runs as `development`, which among other
      # things asks pino for the `pino-pretty` transport that a pruned
      # production image does not contain. `environment` beats `env_file`.
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-finance}:${POSTGRES_PASSWORD:-finance}@postgres:5432/${POSTGRES_DB:-finance}
      REDIS_URL: redis://redis:6379
      SMTP_HOST: mailhog
      SMTP_PORT: "1025"
    ports:
      - "${PORT:-4000}:4000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: finance-api
    container_name: finance_worker
    profiles: ["app"]
    restart: unless-stopped
    command: ["node", "apps/api/dist/worker.js"]
    env_file: .env
    environment:
      # `env_file` beats the image's own ENV, and `.env` is a development file —
      # without this the container runs as `development`, which among other
      # things asks pino for the `pino-pretty` transport that a pruned
      # production image does not contain. `environment` beats `env_file`.
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-finance}:${POSTGRES_PASSWORD:-finance}@postgres:5432/${POSTGRES_DB:-finance}
      REDIS_URL: redis://redis:6379
      SMTP_HOST: mailhog
      SMTP_PORT: "1025"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
